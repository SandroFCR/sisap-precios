[project]
name = "sisap-precios"
version = "0.1.0"
description = "Pipeline de datos de precios agropecuarios (SISAP - MIDAGRI)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.14",
    "pydantic>=2.13",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "tenacity>=9.0",
    "duckdb>=1.5",
    "streamlit>=1.38",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# DTZ011: pedimos fechas calendario "naive" a proposito (calzan con las
# fechas calendario, sin hora, que usa el portal de MIDAGRI) -- no es un
# datetime con hora donde la zona horaria importaria.
ignore = ["DTZ011"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
