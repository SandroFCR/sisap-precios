name: CI

"on":
  push:
    branches: [master]
  pull_request:

# solo lectura: este workflow corre tambien para PRs de forks
permissions:
  contents: read

jobs:
  test:
    # a diferencia de actualizar_datos.yml (que necesita el runner
    # autohospedado porque MIDAGRI bloquea IPs de datacenter), estos tests
    # solo leen el parquet ya versionado en el repo -- no le pegan al sitio
    # de SISAP, asi que un runner normal de GitHub alcanza. NUNCA cambiar
    # esto a self-hosted: corre codigo de PRs de cualquier fork.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Instalar el proyecto (versiones de produccion + dependencias de dev)
        # primero requirements.txt (lo que instala Streamlit Cloud), para que
        # los tests corran contra las mismas versiones que el dashboard publicado
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint (ruff, incluye reglas de seguridad S)
        run: ruff check .

      - name: Auditoria de dependencias (CVEs conocidos)
        # corre tambien con cada commit diario de datos del bot: una
        # vulnerabilidad nueva en una dependencia aparece en rojo al dia
        run: pip-audit --skip-editable

      - name: Tests (pytest)
        run: pytest -q
